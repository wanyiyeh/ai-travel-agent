name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Integration tests run against Postgres (ADR-0007); the suite rebuilds
    # travel_test from the migrations (tests/integration/global-setup.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
          POSTGRES_DB: travel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://travel:travel@localhost:5432/travel_test"
      OPENAI_API_KEY: "sk-ci-placeholder"
      GOOGLE_PLACES_API_KEY: "ci-placeholder"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "ci-placeholder"
      # Auth.js needs these at runtime; CI never completes a real sign-in.
      AUTH_SECRET: "ci-placeholder-secret-not-used-for-real-sessions"
      AUTH_GOOGLE_ID: "ci-placeholder.apps.googleusercontent.com"
      AUTH_GOOGLE_SECRET: "ci-placeholder"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build on a known high/critical vulnerability in anything
      # that ships (dev-only tooling is left to Dependabot's update PRs).
      - run: npm audit --omit=dev --audit-level=high

      - run: npx prisma generate

      - run: npm run lint

      - run: npm test

      - run: npm run test:integration

      - run: npm run build
